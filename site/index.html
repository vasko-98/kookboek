<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFF8EF">
<title>Kookboek</title>
<link rel="icon" href="iconen/_standaard.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="app/icoon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2A1A14;
    --muted: #6B5548;
    --cream: #FFF8EF;
    --white: #FFFFFF;
    --tomaat: #E4573D;
    --mosterd: #F4B740;
    --salie: #A9C49A;
    --lila: #C9B6E4;
    --line: 2px solid var(--ink);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--cream); color: var(--ink);
    font: 16px/1.5 'Bricolage Grotesque', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 20px 64px; }

  /* ---------- Overzicht ---------- */
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 14px; }
  .kicker { display: block; font-size: 14px; color: var(--muted); margin-bottom: 2px; }
  .top h1 { font-size: clamp(34px, 7vw, 56px); letter-spacing: -0.03em; }
  .pill-dark { background: var(--ink); color: var(--cream); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; white-space: nowrap; }

  .search { display: flex; align-items: center; gap: 10px; background: var(--white); border: var(--line); border-radius: 16px; padding: 9px 14px; }
  .search input { border: 0; background: transparent; font: inherit; font-size: 16px; color: var(--ink); flex: 1; outline: none; min-width: 0; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 16px 2px 6px; margin: 0 -2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  @media (min-width: 700px) { .chips { flex-wrap: wrap; overflow: visible; } }
  .chip { flex: none; min-height: 44px; border-radius: 999px; border: var(--line); background: var(--white); padding: 0 16px; font-weight: 600; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--cream); }
  .chip { display: inline-flex; align-items: center; gap: 6px; }
  a.pill-dark { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; }
  .top-acties { display: flex; gap: 8px; }
  a.taal { background: var(--white); color: var(--ink); border: var(--line); }
  .lrecept { background: var(--white); border: var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 8px; }
  .lkop { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .lrij { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .lrecept .lnaam { font-weight: 700; }
  .lrecept .stepper button { width: 36px; height: 36px; }
  .lrecept .btn { min-height: 36px; font-size: 14px; }
  .lacties { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; }
  .lacties .btn { background: var(--white); }
  .huis { display: flex; flex-wrap: wrap; gap: 8px; }
  .huis .chip { font-weight: 400; display: inline-flex; align-items: center; gap: 6px; }
  .msg a { text-underline-offset: 3px; }
  .r-acties { display: flex; gap: 6px; }
  .r-acties .btn { white-space: nowrap; }
  @media (max-width: 460px) { .r-acties .btn { padding: 0 11px; font-size: 14px; gap: 5px; } }
  .balk { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .balk .chip.aan { background: var(--ink); color: var(--cream); }
  .balk .pijl { width: 8px; height: 8px; border-right: 2.5px solid currentColor; border-bottom: 2.5px solid currentColor; transform: translateY(-2px) rotate(45deg); margin-left: 2px; }
  .balk [aria-expanded="true"] .pijl { transform: translateY(2px) rotate(-135deg); }
  @media (max-width: 440px) { .balk .lbl { display: none; } .balk .chip { padding: 0 13px; } .wrap { padding-left: 16px; padding-right: 16px; } }
  .sorteer { margin-left: auto; flex: none; min-height: 44px; border: var(--line); border-radius: 999px; background: var(--white); padding: 0 12px; font: inherit; font-weight: 600; color: var(--ink); }
  .paneel { margin-top: 4px; }
  .cat-naam { display: block; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; margin-top: 10px; }
  .paneel .chips { padding: 6px 2px 2px; }

  .featured { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding: 12px 16px; border: var(--line); border-radius: 20px; text-decoration: none; box-shadow: 3px 3px 0 var(--ink); transition: transform .12s, box-shadow .12s; }
  .featured:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--ink); }
  .featured .body, .card .body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .featured .label { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
  .featured h2 { font-size: clamp(20px, 4.5vw, 26px); text-wrap: balance; }
  .meta { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .lijstkop { display: flex; align-items: center; gap: 10px; margin: 16px 0 8px; font-size: 15px; font-weight: 800; letter-spacing: 0; }
  .lijstkop button { border: 0; background: none; padding: 8px 0; font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; margin-top: 14px; }
  .lijstkop + .grid { margin-top: 0; }
  .card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: var(--line); border-radius: 18px; text-decoration: none; transition: transform .12s, box-shadow .12s; }
  .card:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
  .card h3 { font-size: 17px; line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance; overflow-wrap: break-word; }
  .card .meta { font-size: 12.5px; }
  .disc { position: relative; flex: none; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: var(--cream); border: var(--line); }
  .disc img { width: 42px; height: 42px; display: block; }
  .featured .disc { width: 64px; height: 64px; }
  .featured .disc img { width: 52px; height: 52px; }
  .disc .fav { position: absolute; right: -5px; bottom: -4px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--cream); }
  .disc .fav svg { width: 12px; height: 12px; vertical-align: 0 !important; }
  .disc.big { width: 104px; height: 104px; }
  .disc.big img { width: 84px; height: 84px; }
  .empty { padding: 40px 0; text-align: center; color: var(--muted); }

  /* ---------- Recept ---------- */
  .r-band { padding: 20px 0 32px; }
  .r-band .wrap { padding-top: 0; padding-bottom: 0; display: flex; flex-direction: column; gap: 16px; }
  .r-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .round { width: 44px; height: 44px; border-radius: 50%; background: var(--cream); border: var(--line); display: grid; place-items: center; text-decoration: none; }
  .btn { min-height: 44px; border-radius: 999px; background: var(--cream); border: var(--line); padding: 0 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .btn[aria-pressed="true"] { background: var(--ink); color: var(--cream); }
  .r-title { display: flex; align-items: center; gap: 18px; }
  .r-title h1 { font-size: clamp(30px, 6vw, 46px); }
  .oms { margin: 0; font-size: 16px; line-height: 1.45; background: var(--cream); border: var(--line); border-radius: 14px; padding: 10px 14px; max-width: 60ch; }
  .featured .oms-kort { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips-static { display: flex; gap: 8px; flex-wrap: wrap; font-size: 14px; font-weight: 600; }
  .werk { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 13px; font-weight: 600; margin-top: 10px; }
  .werk b { letter-spacing: 1px; margin-left: 4px; } .werk i { font-style: normal; opacity: .25; }
  .chips-static span { background: var(--cream); border: var(--line); border-radius: 999px; padding: 4px 12px; }
  .msg { font-size: 14px; font-weight: 600; }
  .src { font-size: 14px; }

  .sheet { background: var(--cream); border-top: var(--line); border-radius: 28px 28px 0 0; min-height: 60vh; }
  .sheet .wrap { display: grid; gap: 28px; padding-top: 28px; }
  @media (min-width: 820px) { .sheet .wrap { grid-template-columns: 340px 1fr; align-items: start; } .ingr { position: sticky; top: 20px; } }
  .sec-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .sec-head h2 { font-size: 24px; }
  .stepper { display: flex; align-items: center; border: var(--line); border-radius: 999px; background: var(--white); }
  .stepper button { width: 44px; height: 44px; border: 0; background: transparent; font-size: 20px; font-weight: 800; }
  .stepper output { font-weight: 600; padding: 0 2px; min-width: 56px; text-align: center; }
  .note { font-size: 13px; color: var(--muted); margin: -4px 0 10px; }
  .group { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; margin: 16px 0 8px; }
  .ingr ul, .steps ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .ingr label { display: flex; gap: 12px; align-items: center; background: var(--white); border: var(--line); border-radius: 14px; padding: 10px 14px; cursor: pointer; }
  .ingr input { width: 20px; height: 20px; accent-color: var(--ink); flex: none; margin: 0; }
  .ingr li.done label { background: var(--salie); }
  .ingr li.done .txt { text-decoration: line-through; }
  .steps li button { width: 100%; text-align: left; display: flex; gap: 14px; align-items: flex-start; padding: 12px; border: 2px solid transparent; border-radius: 16px; background: transparent; font-size: 17px; line-height: 1.5; }
  .num { flex: none; width: 36px; height: 36px; border-radius: 50%; border: var(--line); display: grid; place-items: center; font-weight: 800; }
  .steps li.current button { background: var(--hl, var(--mosterd)); border-color: var(--ink); }
  .steps li.current .num { background: var(--ink); color: var(--cream); }
  .steps li.done button { opacity: .5; }
  .steps li.done .num { background: var(--ink); color: var(--cream); }
  .hint { font-size: 14px; color: var(--muted); margin: -4px 0 10px; }
  .tip { margin-top: 20px; background: var(--lila); border: var(--line); border-radius: 18px; padding: 16px; font-size: 16px; line-height: 1.5; }
  .tip strong { display: block; margin-bottom: 6px; }
  .tip ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
</style>
</head>
<body>
<div id="app"><main class="wrap"><p class="empty">Recepten laden…</p></main></div>

<script>
(() => {
  const app = document.getElementById('app');
  // Taal: /en/ is de Engelse versie (gemaakt door scripts/build.mjs). Daar staan de bestanden een map hoger.
  const EN = document.documentElement.lang === 'en', BASE = EN ? '../' : '', LOC = EN ? 'en-GB' : 'nl';
  const T = (nl, en) => EN ? en : nl;
  // Vaste categoriewaarden blijven in de recepten Nederlands; alleen het tonen wordt vertaald. Keuken staat in <id>.en.json.
  const WAARDEN_EN = {
    ontbijt: 'breakfast', lunch: 'lunch', diner: 'dinner', vega: 'vegetarian', vlees: 'meat', vis: 'fish',
    oven: 'oven', 'één pan': 'one pan', 'meerdere pannen': 'multiple pans', BBQ: 'BBQ', 'geen koken': 'no cooking',
    'weinig werk': 'low effort', gemiddeld: 'medium effort', 'veel werk': 'high effort',
    weinig: 'low', veel: 'high',
    'groente & fruit': 'fruit & veg', 'vlees, vis & vega': 'meat, fish & vegetarian', 'zuivel & eieren': 'dairy & eggs',
    'brood & deeg': 'bread & pastry', 'pasta, rijst & granen': 'pasta, rice & grains', 'conserven & potten': 'tins & jars',
    'sauzen & olie': 'sauces & oil', 'kruiden & specerijen': 'herbs & spices', 'overig houdbaar': 'other pantry items'
  };
  const toon = v => EN ? (WAARDEN_EN[v] || v) : v;
  // Eenheden [enkelvoud, meervoud]; g en ml blijven zoals ze zijn.
  const EENHEDEN = EN
    ? { el: ['tbsp', 'tbsp'], tl: ['tsp', 'tsp'], teentje: ['clove', 'cloves'], rol: ['roll', 'rolls'], zak: ['bag', 'bags'], pakje: ['packet', 'packets'], handje: ['handful', 'handfuls'], blokje: ['cube', 'cubes'] }
    : { teentje: ['teentje', 'teentjes'], rol: ['rol', 'rollen'], zak: ['zak', 'zakken'], pakje: ['pakje', 'pakjes'], handje: ['handje', 'handjes'], blokje: ['blokje', 'blokjes'] };
  const eenheidTekst = (u, v) => { const m = EENHEDEN[eenheid(u)]; return m ? m[v > 1 ? 1 : 0] : u; };
  const pers = n => EN ? n + (n === 1 ? ' person' : ' people') : n + ' pers.';
  app.innerHTML = `<main class="wrap"><p class="empty">${T('Recepten laden…', 'Loading recipes…')}</p></main>`;
  const KLEUREN = { tomaat: '#E4573D', mosterd: '#F4B740', salie: '#A9C49A', lila: '#C9B6E4', wit: '#FFFFFF' };
  const VOLGORDE = ['tomaat', 'salie', 'mosterd', 'lila', 'wit'];
  let recepten = [];
  let zoek = '', sort = 'snel', filters = {}, favFilter = false, filtersOpen = false;
  const staat = {};
  const laad = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
  const bewaar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  let lijst = laad('kookboek-lijst', {});            // { receptId: { p: personen, k: { keuzelabel: index } } }
  let afgevinkt = new Set(laad('kookboek-afgevinkt', []));
  let nodig = new Set(laad('kookboek-nodig', []));    // "waarschijnlijk in huis", maar toch kopen
  // Vinkjes van producten die niet meer op het lijstje staan vervallen, zodat ze later niet afgevinkt terugkomen.
  const bewaarLijst = () => {
    const { groepen, huis } = lijstRegels();
    const keys = new Set(groepen.flatMap(g => g.regels.map(e => e.key))), hkeys = new Set(huis.map(e => e.key));
    afgevinkt = new Set([...afgevinkt].filter(k => keys.has(k)));
    nodig = new Set([...nodig].filter(k => hkeys.has(k)));
    bewaar('kookboek-lijst', lijst); bewaar('kookboek-afgevinkt', [...afgevinkt]); bewaar('kookboek-nodig', [...nodig]);
  };
  let wakeLock = null, wilWake = false;

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const kleur = (r, i) => KLEUREN[r.kleur] || KLEUREN[VOLGORDE[i % VOLGORDE.length]];
  const icoon = r => `<img src="${BASE}iconen/${esc(r.id)}.svg" alt="" onerror="this.onerror=null;this.src='${BASE}iconen/_standaard.svg'">`;
  const svg = {
    filter: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>',
    vink: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    mand: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2.2l2.3 10.5h10.2L20 7H6"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>',
    zoek: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
    terug: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
    hart: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="vertical-align:-2px"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>',
    zon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
  };

  // ---------- Hoeveelheden omrekenen ----------
  const breuken = { 0.25: '¼', 0.5: '½', 0.75: '¾' };
  function fmtGetal(x) {
    const heel = Math.floor(x + 1e-9), rest = +(x - heel).toFixed(2);
    if (rest === 0) return String(heel);
    if (breuken[rest]) return (heel || '') + breuken[rest];
    return x.toLocaleString(LOC, { maximumFractionDigits: 1 });
  }
  function schaal(q, u, f) {
    if (q == null) return null;
    let v = q * f;
    if (u === 'g' || u === 'ml') v = v >= 50 ? Math.round(v / 5) * 5 : Math.max(1, Math.round(v));
    else if (u === 'el' || u === 'tl') v = Math.max(0.25, Math.round(v * 4) / 4);
    else if (u && u.startsWith('teentje')) v = Math.max(1, Math.ceil(v - 0.01));
    else v = Math.max(0.5, Math.round(v * 2) / 2);
    return v;
  }
  function hoeveelheid(it, f) {
    const v = schaal(it.q, it.u, f);
    if (v == null) return '';
    return fmtGetal(v) + (it.u ? ' ' + eenheidTekst(it.u, v) : '');
  }

  // ---------- Overzicht ----------
  const TIJDEN = ['tot 15', '15-30', '30-45', '45-60', '60+'];
  const MOEITEN = ['weinig werk', 'gemiddeld', 'veel werk'];
  const tijdLabel = t => (EN ? t.replace('tot', 'up to') : t).replace('-', '–') + ' min';
  const cap = t => t[0].toUpperCase() + t.slice(1);
  const CATEGORIEEN = [
    { k: 'keuken', label: T('Keuken', 'Cuisine'), van: r => [r.keuken] },
    { k: 'maaltijd', label: T('Maaltijd', 'Meal'), van: r => r.maaltijd },
    { k: 'dieet', label: T('Dieet', 'Diet'), van: r => [r.dieet] },
    { k: 'bereiding', label: T('Bereiding', 'Cooking'), van: r => [r.bereiding] },
    { k: 'moeite', label: T('Moeite', 'Effort'), van: r => [r.moeite], volgorde: MOEITEN },
    { k: 'tijd', label: T('Tijd', 'Time'), van: r => [r.tijd], volgorde: TIJDEN, toon: tijdLabel },
  ];
  function waarden(c) {
    const set = new Set();
    recepten.forEach(r => c.van(r).forEach(v => set.add(v)));
    return c.volgorde ? c.volgorde.filter(v => set.has(v)) : [...set].sort((a, b) => toon(a).localeCompare(toon(b), LOC));
  }
  const zoekTekst = r => [r.titel, r.omschrijving || '', r.keuken, ...[...r.maaltijd, r.dieet, r.bereiding].map(toon), ...r.ingredienten.flatMap(g => g.items.map(i => i.n))].join(' ').toLowerCase();
  const meta = r => [tijdLabel(r.tijd), toon(r.moeite), r.keuken].join(' · ');
  const tijdIdx = r => TIJDEN.indexOf(r.tijd);
  function sorteer(lijst) {
    const s = lijst.slice();
    if (sort === 'snel') s.sort((a, b) => tijdIdx(a) - tijdIdx(b) || a.titel.localeCompare(b.titel, LOC));
    if (sort === 'lang') s.sort((a, b) => tijdIdx(b) - tijdIdx(a) || a.titel.localeCompare(b.titel, LOC));
    if (sort === 'fav') s.sort((a, b) => (!!b.favoriet - !!a.favoriet) || tijdIdx(a) - tijdIdx(b));
    return s;
  }

  function renderOverzicht() {
    const aantal = Object.keys(filters).length;
    const actief = aantal > 0 || favFilter;
    const zichtbaar = sorteer(recepten.filter(r =>
      (!favFilter || r.favoriet) &&
      CATEGORIEEN.every(c => !filters[c.k] || c.van(r).includes(filters[c.k])) &&
      (!zoek || zoekTekst(r).includes(zoek.toLowerCase()))));
    // Wisselt elke dag tussen de favorieten
    const favs = recepten.filter(r => r.favoriet);
    const favoriet = favs.length ? favs[Math.floor(Date.now() / 864e5) % favs.length] : null;
    const toonFav = favoriet && !actief && !zoek;
    const sorts = [['snel', T('Snelst', 'Quickest')], ['lang', T('Langst', 'Longest')], ['fav', T('Favoriet', 'Favourite')]];
    const kaart = r => `
        <a class="card" href="#${esc(r.id)}" style="background:${kleur(r, recepten.indexOf(r))}">
          <span class="disc">${icoon(r)}${r.favoriet ? `<span class="fav" role="img" aria-label="${T('Favoriet', 'Favourite')}">${svg.hart}</span>` : ''}</span>
          <span class="body"><h3>${esc(r.titel)}</h3><span class="meta">${esc(meta(r))}</span></span>
        </a>`;

    app.innerHTML = `<main class="wrap">
      <header class="top">
        <div><span class="kicker">${T('Wat eten we vandaag?', 'What are we eating today?')}</span><h1>${T('Kookboek', 'Cookbook')}</h1></div>
        <div class="top-acties">
          <a class="pill-dark taal" href="${EN ? '../' : 'en/'}" hreflang="${EN ? 'nl' : 'en'}" lang="${EN ? 'nl' : 'en'}" aria-label="${EN ? 'Nederlands' : 'English'}">${EN ? 'NL' : 'EN'}</a>
          <a class="pill-dark" href="#boodschappen" aria-label="${T('Boodschappenlijst', 'Shopping list')}">${svg.mand}${Object.keys(lijst).length ? ' ' + Object.keys(lijst).length : ''}</a>
        </div>
      </header>
      <label class="search">${svg.zoek}<input id="zoek" type="search" placeholder="${T('Zoek op recept of ingrediënt', 'Search recipes or ingredients')}" aria-label="${T('Zoeken', 'Search')}" value="${esc(zoek)}"></label>
      <div class="balk">
        ${favs.length ? `<button class="chip hart" data-fav="1" aria-pressed="${favFilter}" aria-label="${T('Alleen favorieten', 'Favourites only')}">${svg.hart}<span class="lbl">${T('Favorieten', 'Favourites')}</span></button>` : ''}
        <button class="chip${aantal ? ' aan' : ''}" id="filterknop" aria-expanded="${filtersOpen}" aria-controls="paneel">${svg.filter} Filters${aantal ? ' (' + aantal + ')' : ''}<span class="pijl"></span></button>
        <select class="sorteer" id="sorteer" aria-label="${T('Sorteren', 'Sort')}">${sorts.map(([k, l]) => `<option value="${k}"${sort === k ? ' selected' : ''}>${l}</option>`).join('')}</select>
      </div>
      <div class="paneel" id="paneel"${filtersOpen ? '' : ' hidden'}>
        ${CATEGORIEEN.map(c => `<div class="cat"><span class="cat-naam">${c.label}</span>
          <div class="chips" role="group" aria-label="${c.label}">${waarden(c).map(v =>
            `<button class="chip" data-cat="${c.k}" data-w="${esc(v)}" aria-pressed="${filters[c.k] === v}">${esc(c.toon ? c.toon(v) : cap(toon(v)))}</button>`).join('')}</div></div>`).join('')}
      </div>
      ${toonFav ? `
      <a class="featured" href="#${esc(favoriet.id)}" style="background:${kleur(favoriet, recepten.indexOf(favoriet))}">
        <span class="disc">${icoon(favoriet)}</span>
        <span class="body"><span class="label">${svg.hart} ${favs.length > 1 ? T('Favoriet van vandaag', 'Today\'s favourite') : T('Favoriet', 'Favourite')}</span>
          <h2>${esc(favoriet.titel)}</h2>${favoriet.omschrijving ? `<span class="oms-kort">${esc(favoriet.omschrijving)}</span>` : ''}<span class="meta">${esc(meta(favoriet))}</span></span>
      </a>` : ''}
      ${actief || zoek
        ? `<h2 class="lijstkop">${zichtbaar.length} ${zichtbaar.length === 1 ? T('recept', 'recipe') : T('recepten', 'recipes')}<button id="wisfilters">${T('Wis filters', 'Clear filters')}</button></h2>`
        : `<h2 class="sr">${T('Alle recepten', 'All recipes')} (${recepten.length})</h2>`}
      ${zichtbaar.length ? `<div class="grid">${zichtbaar.map(kaart).join('')}</div>` : `<p class="empty">${T('Geen recepten gevonden.', 'No recipes found.')}</p>`}
    </main>`;

    const z = document.getElementById('zoek');
    z.addEventListener('input', e => {
      zoek = e.target.value; const pos = e.target.selectionStart;
      renderOverzicht();
      const nz = document.getElementById('zoek'); nz.focus(); nz.setSelectionRange(pos, pos);
    });
    document.getElementById('filterknop').onclick = () => { filtersOpen = !filtersOpen; renderOverzicht(); document.getElementById('filterknop').focus(); };
    const wis = document.getElementById('wisfilters');
    if (wis) wis.onclick = () => { filters = {}; favFilter = false; zoek = ''; renderOverzicht(); };
    const fb = app.querySelector('[data-fav]');
    if (fb) fb.onclick = () => { favFilter = !favFilter; renderOverzicht(); };
    app.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
      const k = b.dataset.cat, w = b.dataset.w;
      if (filters[k] === w) delete filters[k]; else filters[k] = w;
      renderOverzicht();
    });
    document.getElementById('sorteer').onchange = e => { sort = e.target.value; renderOverzicht(); };
  }

  // ---------- Recept ----------
  // Aantal personen en afgevinkte ingrediënten/stappen blijven bewaard, zodat een herladen tab tijdens het koken niets kwijtraakt.
  // De vinkjes vervallen na 12 uur (volgende keer koken begin je schoon); het aantal personen blijft.
  let voortgang = laad('kookboek-voortgang', {});     // { receptId: { p, ingr: [i], stap: [i], t: tijdstip } }
  const VERS = 12 * 36e5;
  function getStaat(r) {
    if (staat[r.id]) return staat[r.id];
    const v = voortgang[r.id] || {}, vers = v.t && Date.now() - v.t < VERS;
    const n = r.ingredienten.reduce((a, g) => a + g.items.length, 0);
    return staat[r.id] = {
      personen: (lijst[r.id] && lijst[r.id].p) || v.p || r.personen,
      ingr: new Set(vers ? (v.ingr || []).filter(i => i < n) : []),
      stap: new Set(vers ? (v.stap || []).filter(i => i < r.stappen.length) : [])
    };
  }
  function bewaarStaat(r) {
    const s = getStaat(r);
    if (s.personen === r.personen && !s.ingr.size && !s.stap.size) delete voortgang[r.id];
    else voortgang[r.id] = { p: s.personen, ingr: [...s.ingr], stap: [...s.stap], t: Date.now() };
    bewaar('kookboek-voortgang', voortgang);
  }

  function renderRecept(r) {
    const s = getStaat(r);
    const f = s.personen / r.personen;
    const bg = kleur(r, recepten.indexOf(r));
    const hl = r.kleur === 'mosterd' ? '#C9B6E4' : '#F4B740';
    const huidige = r.stappen.findIndex((_, i) => !s.stap.has(i));
    let idx = 0;
    const ingr = r.ingredienten.map(g => `
      ${g.groep ? `<div class="group">${esc(g.groep)}</div>` : ''}
      <ul>${g.items.map(it => { const i = idx++; const h = hoeveelheid(it, f); return `
        <li class="${s.ingr.has(i) ? 'done' : ''}"><label>
          <input type="checkbox" data-i="${i}" ${s.ingr.has(i) ? 'checked' : ''}>
          <span class="txt">${h ? `<strong>${esc(h)}</strong> ` : ''}${esc(it.n)}</span>
        </label></li>`; }).join('')}</ul>`).join('');

    app.innerHTML = `
      <div class="r-band" style="background:${bg}">
        <div class="wrap">
          <div class="r-bar">
            <a class="round" href="#" aria-label="${T('Terug naar overzicht', 'Back to overview')}">${svg.terug}</a>
            <div class="r-acties">
              <button class="btn" id="lijstbtn"></button>
              <button class="btn" id="wake" aria-pressed="${wilWake}">${svg.zon} ${T('Scherm aan', 'Screen on')}</button>
            </div>
          </div>
          <div class="r-title"><span class="disc big">${icoon(r)}</span></div>
          <h1>${esc(r.titel)}</h1>
          ${r.omschrijving ? `<p class="oms">${esc(r.omschrijving)}</p>` : ''}
          ${r.nl ? '<p class="oms">This recipe is only available in Dutch for now.</p>' : ''}
          <div class="chips-static">
            <span>${tijdLabel(r.tijd)}</span>
            ${r.moeite ? `<span>${esc(toon(r.moeite))}</span>` : ''}
            ${r.favoriet ? `<span>${svg.hart} ${T('Favoriet', 'Favourite')}</span>` : ''}
            ${[r.keuken, ...[...r.maaltijd, r.dieet, r.bereiding].map(toon)].map(t => `<span>${esc(t)}</span>`).join('')}
          </div>
          ${r.werk ? `<div class="werk">${[['snijwerk', T('Snijwerk', 'Chopping')], ['pan', T('Aan de pan', 'At the stove')], ['afwas', T('Afwas', 'Washing up')]].map(([k, l]) => `<span>${l} <b aria-label="${esc(toon(r.werk[k]))}">${'●'.repeat(['weinig', 'gemiddeld', 'veel'].indexOf(r.werk[k]) + 1)}<i>${'●'.repeat(2 - ['weinig', 'gemiddeld', 'veel'].indexOf(r.werk[k]))}</i></b></span>`).join('')}</div>` : ''}
          <span class="msg" id="msg" aria-live="polite"></span>
        </div>
      </div>
      <div class="sheet">
        <main class="wrap">
          <section class="ingr">
            <div class="sec-head">
              <h2>${T('Ingrediënten', 'Ingredients')}</h2>
              <div class="stepper">
                <button id="min" aria-label="${T('Minder personen', 'Fewer people')}">−</button>
                <output>${pers(s.personen)}</output>
                <button id="plus" aria-label="${T('Meer personen', 'More people')}">+</button>
              </div>
            </div>
            ${r.hoeveelhedenGeschat ? `<p class="note">${T('Hoeveelheden zijn geschat.', 'Quantities are estimates.')}</p>` : ''}
            ${f !== 1 ? `<p class="note">${T('Omgerekend en afgerond, proef en pas aan.', 'Scaled and rounded, so taste and adjust.')}</p>` : ''}
            ${ingr}
          </section>
          <div>
            <section class="steps" style="--hl:${hl}">
              <div class="sec-head"><h2>${T('Bereiding', 'Method')}</h2><button class="btn" id="reset">${T('Opnieuw', 'Reset')}</button></div>
              <p class="hint">${T('Tik op een stap als hij klaar is. Je voortgang blijft bewaard.', 'Tap a step when it is done. Your progress is saved.')}</p>
              <ol>${r.stappen.map((st, i) => `
                <li class="${s.stap.has(i) ? 'done' : ''} ${i === huidige ? 'current' : ''}">
                  <button data-s="${i}" aria-pressed="${s.stap.has(i)}"><span class="num">${i + 1}</span><span>${esc(st)}</span></button>
                </li>`).join('')}</ol>
            </section>
            ${r.tips && r.tips.length ? `<aside class="tip"><strong>Tips</strong><ul>${r.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul></aside>` : ''}
          </div>
        </main>
      </div>`;

    // Staat het recept op het lijstje, dan volgt het lijstje het aantal personen dat je hier kiest.
    const personen = d => {
      const n = s.personen + d; if (n < 1 || n > 12) return;
      s.personen = n; bewaarStaat(r); if (lijst[r.id]) { lijst[r.id].p = n; bewaarLijst(); }
      const y = window.scrollY; renderRecept(r); window.scrollTo(0, y);
    };
    document.getElementById('min').onclick = () => personen(-1);
    document.getElementById('plus').onclick = () => personen(1);
    document.getElementById('reset').onclick = () => { s.ingr.clear(); s.stap.clear(); bewaarStaat(r); renderRecept(r); };
    document.getElementById('wake').onclick = toggleWake;
    // Eerste tik zet het recept op het lijstje en blijft hier; daarna opent de knop het lijstje.
    const lb = document.getElementById('lijstbtn');
    const toonLijstKnop = () => {
      lb.innerHTML = lijst[r.id] ? svg.vink + T(' Op lijstje', ' On list') : svg.mand + T(' Boodschappen', ' Shopping');
      lb.setAttribute('aria-label', lijst[r.id] ? T('Op je lijstje, open boodschappenlijst', 'On your list, open shopping list') : T('Zet op boodschappenlijst', 'Add to shopping list'));
    };
    toonLijstKnop();
    lb.onclick = () => {
      if (lijst[r.id]) { location.hash = '#boodschappen'; return; }
      lijst[r.id] = { p: s.personen, k: {} };
      bewaarLijst(); toonLijstKnop();
      document.getElementById('msg').innerHTML = T(`Op je lijstje gezet (${pers(s.personen)}). <a href="#boodschappen">Bekijk lijstje</a>`, `Added to your list (${pers(s.personen)}). <a href="#boodschappen">View list</a>`);
    };
    app.querySelectorAll('.ingr input').forEach(cb => cb.onchange = () => {
      const i = +cb.dataset.i; cb.checked ? s.ingr.add(i) : s.ingr.delete(i);
      cb.closest('li').classList.toggle('done', cb.checked);
      bewaarStaat(r);
    });
    app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
      const i = +b.dataset.s; s.stap.has(i) ? s.stap.delete(i) : s.stap.add(i);
      bewaarStaat(r);
      const y = window.scrollY; renderRecept(r); window.scrollTo(0, y);
    });
  }

  // ---------- Boodschappenlijst ----------
  const SOORTEN = ['groente & fruit', 'vlees, vis & vega', 'zuivel & eieren', 'brood & deeg', 'pasta, rijst & granen', 'conserven & potten', 'sauzen & olie', 'kruiden & specerijen', 'overig houdbaar'];
  const productNaam = it => (it.p || it.n.replace(/\s*\(.*?\)/g, '').split(',')[0]).trim().toLowerCase();
  const eenheid = u => (u && u.startsWith('teentje') ? 'teentje' : (u || ''));
  const optioneel = (g, it) => /optioneel|optional/i.test(g.groep || '') || /optioneel|optional/i.test(it.n);
  // Naam van een keuze (bijv. Saus) om te tonen; de Nederlandse naam is de sleutel in het lijstje.
  const keuzeNaam = (r, k) => (r.ingredienten.find(g => g.keuze === k) || {}).keuzeNaam || k;

  // Per recept: welke groep van een keuze (bijv. saus A of B) is gekozen
  function opties(r) {
    const o = {};
    r.ingredienten.forEach(g => { if (g.keuze) (o[g.keuze] = o[g.keuze] || []).push(g.groep); });
    return o;
  }
  function lijstRegels() {
    const m = new Map();
    for (const [id, st] of Object.entries(lijst)) {
      const r = recepten.find(x => x.id === id);
      if (!r) continue;
      const f = st.p / r.personen, o = opties(r);
      r.ingredienten.forEach(g => {
        if (g.keuze && o[g.keuze][(st.k && st.k[g.keuze]) || 0] !== g.groep) return;
        g.items.forEach(it => {
          if (it.s == null) return;
          // Sleutel met de Nederlandse productnaam (k in de Engelse versie), zodat vinkjes in beide talen gelden.
          const naam = productNaam(it), opt = optioneel(g, it), key = it.s + '|' + (it.k || naam) + '|' + opt;
          const e = m.get(key) || { key, naam, s: it.s, opt, delen: new Map() };
          if (it.huis === false) e.huis = false; else if (it.huis === true && e.huis !== false) e.huis = true;
          const v = schaal(it.q, it.u, f);
          if (v != null) e.delen.set(eenheid(it.u), (e.delen.get(eenheid(it.u)) || 0) + v);
          m.set(key, e);
        });
      });
    }
    const alle = [...m.values()].sort((a, b) => a.naam.localeCompare(b.naam, LOC));
    return {
      groepen: SOORTEN.map(s => ({ soort: s, regels: alle.filter(e => e.s === s && !inHuis(e)) })).filter(g => g.regels.length),
      huis: alle.filter(inHuis)
    };
  }
  // Waarschijnlijk in huis: kruiden, sauzen/olie en houdbaar waarvan je alleen lepels of een snufje nodig hebt.
  // Per ingrediënt te overschrijven met "huis": true/false in het recept.
  const HUIS_SOORTEN = ['kruiden & specerijen', 'sauzen & olie', 'overig houdbaar'];
  const inHuis = e => e.huis != null ? e.huis : HUIS_SOORTEN.includes(e.s) && [...e.delen.keys()].every(u => u === 'el' || u === 'tl');
  // Winkelhoeveelheid: gram/ml en lepels samen in één getal (el = 15, tl = 5), stuks naar boven afgerond.
  // Alleen lepels: geen hoeveelheid, je koopt toch een pot of fles.
  function regelTekst(e) {
    const d = e.delen, delen = [], maat = ['g', 'ml'].find(u => d.has(u));
    if (maat) {
      const tot = (d.get('g') || 0) + (d.get('ml') || 0) + (d.get('el') || 0) * 15 + (d.get('tl') || 0) * 5;
      delen.push((tot >= 50 ? Math.ceil(tot / 5 - 1e-9) * 5 : Math.ceil(tot - 1e-9)) + ' ' + maat);
    }
    for (const [u, v] of d) {
      if (['g', 'ml', 'el', 'tl'].includes(u)) continue;
      const n = Math.ceil(v - 1e-9);
      delen.push(n + (u ? ' ' + eenheidTekst(u, n) : ''));
    }
    return [delen.join(' + '), e.naam].filter(Boolean).join(' ') + (e.opt ? T(' (optioneel)', ' (optional)') : '');
  }
  // Eén item per regel, zonder streepjes of lege regels: in Keep (+ > Checkboxes) of Notities (checklist)
  // wordt elke regel dan een afvinkbaar item. Alleen wat nog niet is afgevinkt.
  function lijstTekst() {
    const uit = [];
    const { groepen, huis } = lijstRegels();
    SOORTEN.forEach(soort => {
      const g = groepen.find(x => x.soort === soort);
      const open = [...(g ? g.regels.filter(e => !afgevinkt.has(e.key)) : []), ...huis.filter(e => e.s === soort && nodig.has(e.key))];
      if (open.length) uit.push(toon(soort).toUpperCase(), ...open.map(regelTekst));
    });
    return uit.join('\n');
  }
  // Deelt via het deelmenu (Keep, Notities, ...); anders downloaden als .txt
  async function deelLijst() {
    const namen = Object.keys(lijst).map(id => (recepten.find(x => x.id === id) || {}).titel).filter(Boolean);
    const tekst = lijstTekst(), titel = T('Boodschappen', 'Shopping') + (namen.length ? ': ' + namen.join(', ') : '');
    if (navigator.share) {
      try { await navigator.share({ title: titel, text: tekst }); return ''; }
      catch (e) { if (e && e.name === 'AbortError') return ''; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([tekst], { type: 'text/plain;charset=utf-8' }));
    a.download = T('Boodschappen.txt', 'Shopping.txt');
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    return T('Lijst gedownload (.txt).', 'List downloaded (.txt).');
  }

  let wisBevestig = false;
  function renderLijst() {
    const ids = Object.keys(lijst).filter(id => recepten.some(r => r.id === id));
    const { groepen, huis } = lijstRegels();
    const terug = recepten.some(r => r.id === vorigRecept) ? vorigRecept : '';
    app.innerHTML = `<main class="wrap">
      <div class="r-bar" style="margin-bottom:16px">
        <a class="round" href="#${esc(terug)}" aria-label="${terug ? T('Terug naar recept', 'Back to recipe') : T('Terug naar overzicht', 'Back to overview')}">${svg.terug}</a>
      </div>
      <header class="top">
        <div><span class="kicker">${T('Wat hebben we nodig?', 'What do we need?')}</span><h1>${T('Boodschappen', 'Shopping')}</h1></div>
      </header>
      ${ids.length ? `
      ${ids.map(id => {
        const r = recepten.find(x => x.id === id), st = lijst[id], o = opties(r);
        return `<div class="lrecept" data-id="${esc(id)}">
          <div class="lkop"><span class="lnaam">${esc(r.titel)}</span><button class="btn" data-act="del" aria-label="${T('Verwijder van lijstje', 'Remove from list')}">✕</button></div>
          <div class="lrij">
            <div class="stepper"><button data-act="min" aria-label="${T('Minder personen', 'Fewer people')}">−</button><output>${pers(st.p)}</output><button data-act="plus" aria-label="${T('Meer personen', 'More people')}">+</button></div>
            ${Object.entries(o).map(([label, namen]) => `<button class="btn" data-keuze="${esc(label)}" title="${T('Wissel', 'Switch')}">${esc(keuzeNaam(r, label))}: ${esc(namen[(st.k && st.k[label]) || 0])} ⇄</button>`).join('')}
          </div>
        </div>`;
      }).join('')}
      <div class="lacties">
        <button class="btn" id="deel">${T('Exporteren', 'Export')}</button>
        <button class="btn" id="kopieer">${T('Kopieer', 'Copy')}</button>
        <button class="btn" id="wis">${wisBevestig ? T('Zeker weten?', 'Are you sure?') : T('Leegmaken', 'Clear list')}</button>
      </div>
      <span class="msg" id="lmsg" aria-live="polite"></span>
      <section class="ingr">
        ${groepen.map(g => `<div class="group">${esc(cap(toon(g.soort)))}</div>
          <ul>${g.regels.map(e => `<li class="${afgevinkt.has(e.key) ? 'done' : ''}"><label>
            <input type="checkbox" data-k="${esc(e.key)}" ${afgevinkt.has(e.key) ? 'checked' : ''}>
            <span class="txt">${esc(regelTekst(e))}</span></label></li>`).join('')}</ul>`).join('')}
        ${huis.length ? `<div class="group">${T('Waarschijnlijk in huis', 'Probably at home')}</div>
          <p class="hint">${T('Tik aan wat je toch moet kopen; dat gaat mee bij exporteren en kopiëren.', 'Tap what you still need to buy; it is included when you export or copy.')}</p>
          <div class="huis" role="group" aria-label="${T('Waarschijnlijk in huis', 'Probably at home')}">${huis.map(e =>
            `<button class="chip" data-nodig="${esc(e.key)}" aria-pressed="${nodig.has(e.key)}">${nodig.has(e.key) ? svg.mand : ''}${esc(e.naam)}</button>`).join('')}</div>` : ''}
      </section>` : `<p class="empty">${T('Nog niets op je lijstje. Open een recept en tik op "Boodschappen".', 'Nothing on your list yet. Open a recipe and tap "Shopping".')}</p>`}
    </main>`;
    if (!ids.length) return;
    const msg = t => { document.getElementById('lmsg').textContent = t; };
    app.querySelectorAll('.lrecept').forEach(rij => {
      const id = rij.dataset.id, st = lijst[id], r = recepten.find(x => x.id === id);
      rij.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
        if (b.dataset.act === 'min' && st.p > 1) st.p--;
        if (b.dataset.act === 'plus' && st.p < 12) st.p++;
        if (b.dataset.act === 'del') delete lijst[id];
        else { getStaat(r).personen = st.p; bewaarStaat(r); }
        bewaarLijst(); renderLijst();
      });
      rij.querySelectorAll('[data-keuze]').forEach(b => b.onclick = () => {
        const label = b.dataset.keuze, n = opties(r)[label].length;
        st.k = st.k || {}; st.k[label] = ((st.k[label] || 0) + 1) % n;
        bewaarLijst(); renderLijst();
      });
    });
    app.querySelectorAll('.ingr input').forEach(cb => cb.onchange = () => {
      cb.checked ? afgevinkt.add(cb.dataset.k) : afgevinkt.delete(cb.dataset.k);
      cb.closest('li').classList.toggle('done', cb.checked);
      bewaarLijst();
    });
    app.querySelectorAll('[data-nodig]').forEach(b => b.onclick = () => {
      const k = b.dataset.nodig; nodig.has(k) ? nodig.delete(k) : nodig.add(k);
      bewaarLijst(); const y = window.scrollY; renderLijst(); window.scrollTo(0, y);
    });
    document.getElementById('kopieer').onclick = async () => {
      const t = lijstTekst();
      try { await navigator.clipboard.writeText(t); msg(T('Gekopieerd.', 'Copied.')); }
      catch {
        const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); msg(T('Gekopieerd.', 'Copied.')); } catch { msg(T('Kopiëren lukt niet in deze browser.', 'Copying does not work in this browser.')); }
        ta.remove();
      }
    };
    document.getElementById('deel').onclick = async () => { msg(await deelLijst()); };
    document.getElementById('wis').onclick = () => {
      if (!wisBevestig) { wisBevestig = true; renderLijst(); return; }
      wisBevestig = false; lijst = {}; afgevinkt.clear(); nodig.clear(); bewaarLijst(); renderLijst();
    };
  }

  async function toggleWake() {
    const btn = document.getElementById('wake'), msg = document.getElementById('msg');
    try {
      if (wilWake) { wilWake = false; if (wakeLock) await wakeLock.release(); wakeLock = null; btn.setAttribute('aria-pressed', 'false'); msg.textContent = ''; return; }
      if (!('wakeLock' in navigator)) throw new Error();
      wakeLock = await navigator.wakeLock.request('screen'); wilWake = true;
      wakeLock.addEventListener('release', () => { wakeLock = null; });
      btn.setAttribute('aria-pressed', 'true'); msg.textContent = T('Scherm blijft aan.', 'Screen stays on.');
    } catch {
      wakeLock = null; wilWake = false; btn.setAttribute('aria-pressed', 'false');
      msg.textContent = T('Scherm aan houden werkt niet in deze browser.', 'Keeping the screen on does not work in this browser.');
    }
  }
  // Wake lock vervalt als de tab verborgen wordt; vraag hem opnieuw aan bij terugkeer.
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && wilWake && !wakeLock) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch {}
    }
  });

  // Onthoudt waar je in het overzicht was, zodat je na een recept op dezelfde plek terugkomt.
  let opOverzicht = false, overzichtY = 0, vorigRecept = '', huidigRecept = '';
  try { history.scrollRestoration = 'manual'; } catch {}
  function route() {
    const id = decodeURIComponent(location.hash.slice(1));
    const r = recepten.find(x => x.id === id);
    if (opOverzicht) overzichtY = window.scrollY;
    opOverzicht = !r && id !== 'boodschappen';
    vorigRecept = huidigRecept; huidigRecept = r ? r.id : '';
    wisBevestig = false;
    const naam = T('Kookboek', 'Cookbook');
    if (id === 'boodschappen') document.title = T('Boodschappen', 'Shopping') + ' · ' + naam;
    else document.title = r ? r.titel + ' · ' + naam : naam;
    id === 'boodschappen' ? renderLijst() : r ? renderRecept(r) : renderOverzicht();
    window.scrollTo(0, opOverzicht ? overzichtY : 0);
  }

  fetch(BASE + T('recepten.json', 'recepten.en.json'), { cache: 'no-cache' })
    .then(res => { if (!res.ok) throw new Error(res.status); return res.json(); })
    .then(data => {
      recepten = data.recepten; route(); window.addEventListener('hashchange', route);
      // Herladen tijdens het koken: ga terug naar de stap waar je was.
      const r = recepten.find(x => x.id === huidigRecept);
      if (r && getStaat(r).stap.size) { const li = app.querySelector('.steps li.current'); if (li) li.scrollIntoView({ block: 'center' }); }
    })
    .catch(() => { app.innerHTML = `<main class="wrap"><p class="empty">${T('De recepten konden niet geladen worden.', 'The recipes could not be loaded.')}</p></main>`; });

  // Offline: de service worker bewaart de site en de recepten op het toestel.
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register(BASE + 'sw.js').catch(() => {}));
})();
</script>
</body>
</html>
