<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFF8EF">
<title>Kookboek</title>
<link rel="icon" href="iconen/_standaard.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2A1A14;
    --muted: #6B5548;
    --cream: #FFF8EF;
    --white: #FFFFFF;
    --tomaat: #E4573D;
    --mosterd: #F4B740;
    --salie: #A9C49A;
    --lila: #C9B6E4;
    --line: 2px solid var(--ink);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--cream); color: var(--ink);
    font: 16px/1.5 'Bricolage Grotesque', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 20px 64px; }

  /* ---------- Overzicht ---------- */
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 20px; }
  .kicker { display: block; font-size: 15px; color: var(--muted); margin-bottom: 2px; }
  .top h1 { font-size: clamp(42px, 8vw, 60px); letter-spacing: -0.03em; }
  .pill-dark { background: var(--ink); color: var(--cream); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; white-space: nowrap; }

  .search { display: flex; align-items: center; gap: 10px; background: var(--white); border: var(--line); border-radius: 16px; padding: 12px 16px; }
  .search input { border: 0; background: transparent; font: inherit; font-size: 16px; color: var(--ink); flex: 1; outline: none; min-width: 0; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 16px 2px 6px; margin: 0 -2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  @media (min-width: 700px) { .chips { flex-wrap: wrap; overflow: visible; } }
  .chip { flex: none; min-height: 44px; border-radius: 999px; border: var(--line); background: var(--white); padding: 0 16px; font-weight: 600; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--cream); }
  .r-acties { display: flex; gap: 6px; }
  .r-acties .btn { white-space: nowrap; }
  @media (max-width: 460px) { .r-acties .btn { padding: 0 11px; font-size: 14px; gap: 5px; } }
  .filters { margin-top: 6px; }
  .filters summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: var(--line); border-radius: 999px; background: var(--white); font-weight: 600; user-select: none; }
  .filters summary::-webkit-details-marker { display: none; }
  .filters summary::after { content: ''; width: 8px; height: 8px; border-right: 2.5px solid currentColor; border-bottom: 2.5px solid currentColor; transform: translateY(-2px) rotate(45deg); margin-left: 2px; }
  .filters[open] summary::after { transform: translateY(2px) rotate(-135deg); }
  .filters.actief summary { background: var(--ink); color: var(--cream); }
  .cat-naam { display: block; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; margin-top: 10px; }
  .filters .chips { padding-top: 6px; }

  .featured { display: flex; flex-direction: column; gap: 14px; margin: 18px 0 8px; padding: 20px; border: var(--line); border-radius: 24px; text-decoration: none; box-shadow: 4px 4px 0 var(--ink); transition: transform .12s, box-shadow .12s; }
  .featured:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
  .featured .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .featured h2 { font-size: clamp(26px, 5vw, 34px); }
  .tag-cream { background: var(--cream); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; }
  .meta { font-size: 14px; font-weight: 600; }

  .list-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 26px 0 12px; }
  .list-head h2 { font-size: 24px; }
  .seg { display: flex; border: var(--line); border-radius: 999px; background: var(--white); padding: 2px; }
  .seg button { min-height: 40px; border: 0; border-radius: 999px; background: transparent; padding: 0 14px; font-size: 14px; font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--cream); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .card { display: flex; flex-direction: column; gap: 12px; min-height: 190px; padding: 16px; border: var(--line); border-radius: 24px; text-decoration: none; transition: transform .12s, box-shadow .12s; }
  .card:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
  .card h3 { font-size: 18px; line-height: 1.12; letter-spacing: -0.01em; }
  .card .meta { margin-top: auto; font-size: 13px; }
  .disc { flex: none; display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: var(--cream); border: var(--line); }
  .disc img { width: 52px; height: 52px; display: block; }
  .disc.big { width: 104px; height: 104px; }
  .disc.big img { width: 84px; height: 84px; }
  .empty { padding: 40px 0; text-align: center; color: var(--muted); }

  /* ---------- Recept ---------- */
  .r-band { padding: 20px 0 32px; }
  .r-band .wrap { padding-top: 0; padding-bottom: 0; display: flex; flex-direction: column; gap: 16px; }
  .r-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .round { width: 44px; height: 44px; border-radius: 50%; background: var(--cream); border: var(--line); display: grid; place-items: center; text-decoration: none; }
  .btn { min-height: 44px; border-radius: 999px; background: var(--cream); border: var(--line); padding: 0 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .btn[aria-pressed="true"] { background: var(--ink); color: var(--cream); }
  .r-title { display: flex; align-items: center; gap: 18px; }
  .r-title h1 { font-size: clamp(30px, 6vw, 46px); }
  .chips-static { display: flex; gap: 8px; flex-wrap: wrap; font-size: 14px; font-weight: 600; }
  .chips-static span { background: var(--cream); border: var(--line); border-radius: 999px; padding: 4px 12px; }
  .msg { font-size: 14px; font-weight: 600; }
  .src { font-size: 14px; }

  .sheet { background: var(--cream); border-top: var(--line); border-radius: 28px 28px 0 0; min-height: 60vh; }
  .sheet .wrap { display: grid; gap: 28px; padding-top: 28px; }
  @media (min-width: 820px) { .sheet .wrap { grid-template-columns: 340px 1fr; align-items: start; } .ingr { position: sticky; top: 20px; } }
  .sec-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .sec-head h2 { font-size: 24px; }
  .stepper { display: flex; align-items: center; border: var(--line); border-radius: 999px; background: var(--white); }
  .stepper button { width: 44px; height: 44px; border: 0; background: transparent; font-size: 20px; font-weight: 800; }
  .stepper output { font-weight: 600; padding: 0 2px; min-width: 56px; text-align: center; }
  .note { font-size: 13px; color: var(--muted); margin: -4px 0 10px; }
  .group { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; margin: 16px 0 8px; }
  .ingr ul, .steps ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .ingr label { display: flex; gap: 12px; align-items: center; background: var(--white); border: var(--line); border-radius: 14px; padding: 10px 14px; cursor: pointer; }
  .ingr input { width: 20px; height: 20px; accent-color: var(--ink); flex: none; margin: 0; }
  .ingr li.done label { background: var(--salie); }
  .ingr li.done .txt { text-decoration: line-through; }
  .steps li button { width: 100%; text-align: left; display: flex; gap: 14px; align-items: flex-start; padding: 12px; border: 2px solid transparent; border-radius: 16px; background: transparent; font-size: 17px; line-height: 1.5; }
  .num { flex: none; width: 36px; height: 36px; border-radius: 50%; border: var(--line); display: grid; place-items: center; font-weight: 800; }
  .steps li.current button { background: var(--hl, var(--mosterd)); border-color: var(--ink); }
  .steps li.current .num { background: var(--ink); color: var(--cream); }
  .steps li.done button { opacity: .5; }
  .steps li.done .num { background: var(--ink); color: var(--cream); }
  .hint { font-size: 14px; color: var(--muted); margin: -4px 0 10px; }
  .tip { margin-top: 20px; background: var(--lila); border: var(--line); border-radius: 18px; padding: 16px; font-size: 16px; line-height: 1.5; }
  .tip strong { display: block; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="app"><main class="wrap"><p class="empty">Recepten laden…</p></main></div>

<script>
(() => {
  const app = document.getElementById('app');
  const KLEUREN = { tomaat: '#E4573D', mosterd: '#F4B740', salie: '#A9C49A', lila: '#C9B6E4', wit: '#FFFFFF' };
  const VOLGORDE = ['tomaat', 'salie', 'mosterd', 'lila', 'wit'];
  let recepten = [];
  let zoek = '', sort = 'snel', filters = {}, favFilter = false, filtersOpen = false;
  const staat = {};
  let wakeLock = null, wilWake = false;

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const kleur = (r, i) => KLEUREN[r.kleur] || KLEUREN[VOLGORDE[i % VOLGORDE.length]];
  const icoon = r => `<img src="iconen/${esc(r.id)}.svg" alt="" onerror="this.onerror=null;this.src='iconen/_standaard.svg'">`;
  const svg = {
    filter: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>',
    mand: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2.2l2.3 10.5h10.2L20 7H6"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>',
    zoek: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
    terug: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
    hart: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="vertical-align:-2px"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>',
    zon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
  };

  // ---------- Hoeveelheden omrekenen ----------
  const breuken = { 0.25: '¼', 0.5: '½', 0.75: '¾' };
  function fmtGetal(x) {
    const heel = Math.floor(x + 1e-9), rest = +(x - heel).toFixed(2);
    if (rest === 0) return String(heel);
    if (breuken[rest]) return (heel || '') + breuken[rest];
    return x.toLocaleString('nl-NL', { maximumFractionDigits: 1 });
  }
  function schaal(q, u, f) {
    if (q == null) return null;
    let v = q * f;
    if (u === 'g' || u === 'ml') v = v >= 50 ? Math.round(v / 5) * 5 : Math.max(1, Math.round(v));
    else if (u === 'el' || u === 'tl') v = Math.max(0.25, Math.round(v * 4) / 4);
    else if (u && u.startsWith('teentje')) v = Math.max(1, Math.ceil(v - 0.01));
    else v = Math.max(0.5, Math.round(v * 2) / 2);
    return v;
  }
  function hoeveelheid(it, f) {
    const v = schaal(it.q, it.u, f);
    if (v == null) return '';
    let unit = it.u ? ' ' + it.u : '';
    if (it.u && it.u.startsWith('teentje')) unit = v === 1 ? ' teentje' : ' teentjes';
    else if (it.u === 'rol' && v > 1) unit = ' rollen';
    else if (it.u === 'zak' && v > 1) unit = ' zakken';
    else if (it.u === 'pakje' && v > 1) unit = ' pakjes';
    return fmtGetal(v) + unit;
  }

  // ---------- Overzicht ----------
  const TIJDEN = ['tot 15', '15-30', '30-45', '45-60', '60+'];
  const MOEITEN = ['makkelijk', 'gemiddeld', 'veel werk'];
  const tijdLabel = t => t.replace('-', '–') + ' min';
  const cap = t => t[0].toUpperCase() + t.slice(1);
  const CATEGORIEEN = [
    { k: 'keuken', label: 'Keuken', van: r => [r.keuken] },
    { k: 'maaltijd', label: 'Maaltijd', van: r => r.maaltijd },
    { k: 'dieet', label: 'Dieet', van: r => [r.dieet] },
    { k: 'bereiding', label: 'Bereiding', van: r => [r.bereiding] },
    { k: 'moeite', label: 'Moeite', van: r => [r.moeite], volgorde: MOEITEN },
    { k: 'tijd', label: 'Tijd', van: r => [r.tijd], volgorde: TIJDEN, toon: tijdLabel },
  ];
  function waarden(c) {
    const set = new Set();
    recepten.forEach(r => c.van(r).forEach(v => set.add(v)));
    return c.volgorde ? c.volgorde.filter(v => set.has(v)) : [...set].sort((a, b) => a.localeCompare(b, 'nl'));
  }
  const zoekTekst = r => [r.titel, r.keuken, ...r.maaltijd, r.dieet, r.bereiding, ...r.ingredienten.flatMap(g => g.items.map(i => i.n))].join(' ').toLowerCase();
  const meta = r => [tijdLabel(r.tijd), r.moeite, r.keuken].join(' · ');
  const tijdIdx = r => TIJDEN.indexOf(r.tijd);
  function sorteer(lijst) {
    const s = lijst.slice();
    if (sort === 'snel') s.sort((a, b) => tijdIdx(a) - tijdIdx(b) || a.titel.localeCompare(b.titel, 'nl'));
    if (sort === 'lang') s.sort((a, b) => tijdIdx(b) - tijdIdx(a) || a.titel.localeCompare(b.titel, 'nl'));
    if (sort === 'fav') s.sort((a, b) => (!!b.favoriet - !!a.favoriet) || tijdIdx(a) - tijdIdx(b));
    return s;
  }

  function renderOverzicht() {
    const aantal = Object.keys(filters).length;
    const actief = aantal > 0 || favFilter;
    const lijst = sorteer(recepten.filter(r =>
      (!favFilter || r.favoriet) &&
      CATEGORIEEN.every(c => !filters[c.k] || c.van(r).includes(filters[c.k])) &&
      (!zoek || zoekTekst(r).includes(zoek.toLowerCase()))));
    // Wisselt elke dag tussen de favorieten
    const favs = recepten.filter(r => r.favoriet);
    const favoriet = favs.length ? favs[Math.floor(Date.now() / 864e5) % favs.length] : null;
    const toonFav = favoriet && !actief && !zoek;
    const sorts = [['snel', 'Snelst'], ['lang', 'Langst'], ['fav', 'Favoriet']];

    app.innerHTML = `<main class="wrap">
      <header class="top">
        <div><span class="kicker">Wat eten we vandaag?</span><h1>Kookboek</h1></div>
        <span class="pill-dark">${recepten.length} recepten</span>
      </header>
      <label class="search">${svg.zoek}<input id="zoek" type="search" placeholder="Zoek op recept of ingrediënt" aria-label="Zoeken" value="${esc(zoek)}"></label>
      <div class="chips" role="group" aria-label="Snelfilter">
        <button class="chip" data-reset="1" aria-pressed="${!actief}">Alles</button>
        ${favs.length ? `<button class="chip" data-fav="1" aria-pressed="${favFilter}">${svg.hart} Favorieten</button>` : ''}
      </div>
      <details class="filters${aantal ? ' actief' : ''}" ${filtersOpen ? 'open' : ''}>
        <summary>${svg.filter} Filters${aantal ? ' (' + aantal + ')' : ''}</summary>
        ${CATEGORIEEN.map(c => `<div class="cat"><span class="cat-naam">${c.label}</span>
          <div class="chips" role="group" aria-label="${c.label}">${waarden(c).map(v =>
            `<button class="chip" data-cat="${c.k}" data-w="${esc(v)}" aria-pressed="${filters[c.k] === v}">${esc(c.toon ? c.toon(v) : cap(v))}</button>`).join('')}</div></div>`).join('')}
      </details>
      ${toonFav ? `
      <a class="featured" href="#${esc(favoriet.id)}" style="background:${kleur(favoriet, recepten.indexOf(favoriet))}">
        <div class="row"><span class="tag-cream">${svg.hart} ${favs.length > 1 ? 'Favoriet van vandaag' : 'Favoriet'}</span><span class="disc big">${icoon(favoriet)}</span></div>
        <h2>${esc(favoriet.titel)}</h2>
        <span class="meta">${esc(meta(favoriet))}</span>
      </a>` : ''}
      <div class="list-head">
        <h2>${actief || zoek ? lijst.length + (lijst.length === 1 ? ' recept' : ' recepten') : 'Alle recepten'}</h2>
        <div class="seg" role="group" aria-label="Sorteren">
          ${sorts.map(([k, l]) => `<button data-sort="${k}" aria-pressed="${sort === k}">${l}</button>`).join('')}
        </div>
      </div>
      ${lijst.length ? `<div class="grid">${lijst.map(r => `
        <a class="card" href="#${esc(r.id)}" style="background:${kleur(r, recepten.indexOf(r))}">
          <span class="disc">${icoon(r)}</span>
          <h3>${esc(r.titel)}</h3>
          <span class="meta">${esc(meta(r))}${r.favoriet ? ' · ' + svg.hart : ''}</span>
        </a>`).join('')}</div>` : '<p class="empty">Geen recepten gevonden.</p>'}
    </main>`;

    const z = document.getElementById('zoek');
    z.addEventListener('input', e => {
      zoek = e.target.value; const pos = e.target.selectionStart;
      renderOverzicht();
      const nz = document.getElementById('zoek'); nz.focus(); nz.setSelectionRange(pos, pos);
    });
    app.querySelector('details.filters').addEventListener('toggle', e => { filtersOpen = e.target.open; });
    app.querySelector('[data-reset]').onclick = () => { filters = {}; favFilter = false; renderOverzicht(); };
    const fb = app.querySelector('[data-fav]');
    if (fb) fb.onclick = () => { favFilter = !favFilter; renderOverzicht(); };
    app.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
      const k = b.dataset.cat, w = b.dataset.w;
      if (filters[k] === w) delete filters[k]; else filters[k] = w;
      renderOverzicht();
    });
    app.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { sort = b.dataset.sort; renderOverzicht(); });
  }

  // ---------- Recept ----------
  function getStaat(r) {
    return staat[r.id] || (staat[r.id] = { personen: r.personen, ingr: new Set(), stap: new Set() });
  }

  function renderRecept(r) {
    const s = getStaat(r);
    const f = s.personen / r.personen;
    const bg = kleur(r, recepten.indexOf(r));
    const hl = r.kleur === 'mosterd' ? '#C9B6E4' : '#F4B740';
    const huidige = r.stappen.findIndex((_, i) => !s.stap.has(i));
    let idx = 0;
    const ingr = r.ingredienten.map(g => `
      ${g.groep ? `<div class="group">${esc(g.groep)}</div>` : ''}
      <ul>${g.items.map(it => { const i = idx++; const h = hoeveelheid(it, f); return `
        <li class="${s.ingr.has(i) ? 'done' : ''}"><label>
          <input type="checkbox" data-i="${i}" ${s.ingr.has(i) ? 'checked' : ''}>
          <span class="txt">${h ? `<strong>${esc(h)}</strong> ` : ''}${esc(it.n)}</span>
        </label></li>`; }).join('')}</ul>`).join('');

    app.innerHTML = `
      <div class="r-band" style="background:${bg}">
        <div class="wrap">
          <div class="r-bar">
            <a class="round" href="#" aria-label="Terug naar overzicht">${svg.terug}</a>
            <div class="r-acties">
              <button class="btn" id="notitie">${svg.mand} Boodschappen</button>
              <button class="btn" id="wake" aria-pressed="${wilWake}">${svg.zon} Scherm aan</button>
            </div>
          </div>
          <div class="r-title"><span class="disc big">${icoon(r)}</span></div>
          <h1>${esc(r.titel)}</h1>
          <div class="chips-static">
            <span>${tijdLabel(r.tijd)}</span>
            ${r.moeite ? `<span>${esc(r.moeite)}</span>` : ''}
            ${r.favoriet ? `<span>${svg.hart} Favoriet</span>` : ''}
            ${[r.keuken, ...r.maaltijd, r.dieet, r.bereiding].map(t => `<span>${esc(t)}</span>`).join('')}
          </div>
          <span class="msg" id="msg" aria-live="polite"></span>
        </div>
      </div>
      <div class="sheet">
        <main class="wrap">
          <section class="ingr">
            <div class="sec-head">
              <h2>Ingrediënten</h2>
              <div class="stepper">
                <button id="min" aria-label="Minder personen">−</button>
                <output>${s.personen} pers.</output>
                <button id="plus" aria-label="Meer personen">+</button>
              </div>
            </div>
            ${r.hoeveelhedenGeschat ? '<p class="note">Hoeveelheden zijn geschat.</p>' : ''}
            ${f !== 1 ? '<p class="note">Omgerekend en afgerond, proef en pas aan.</p>' : ''}
            ${ingr}
          </section>
          <div>
            <section class="steps" style="--hl:${hl}">
              <div class="sec-head"><h2>Bereiding</h2><button class="btn" id="reset">Opnieuw</button></div>
              <p class="hint">Tik op een stap als hij klaar is.</p>
              <ol>${r.stappen.map((st, i) => `
                <li class="${s.stap.has(i) ? 'done' : ''} ${i === huidige ? 'current' : ''}">
                  <button data-s="${i}" aria-pressed="${s.stap.has(i)}"><span class="num">${i + 1}</span><span>${esc(st)}</span></button>
                </li>`).join('')}</ol>
            </section>
            ${r.notities ? `<aside class="tip"><strong>Tip voor de volgende keer</strong>${esc(r.notities)}</aside>` : ''}
          </div>
        </main>
      </div>`;

    document.getElementById('min').onclick = () => { if (s.personen > 1) { s.personen--; renderRecept(r); } };
    document.getElementById('plus').onclick = () => { if (s.personen < 12) { s.personen++; renderRecept(r); } };
    document.getElementById('reset').onclick = () => { s.ingr.clear(); s.stap.clear(); renderRecept(r); };
    document.getElementById('wake').onclick = toggleWake;
    document.getElementById('notitie').onclick = async () => {
      document.getElementById('msg').textContent = await deelNotitie(r, s.personen);
    };
    app.querySelectorAll('.ingr input').forEach(cb => cb.onchange = () => {
      const i = +cb.dataset.i; cb.checked ? s.ingr.add(i) : s.ingr.delete(i);
      cb.closest('li').classList.toggle('done', cb.checked);
    });
    app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
      const i = +b.dataset.s; s.stap.has(i) ? s.stap.delete(i) : s.stap.add(i);
      const y = window.scrollY; renderRecept(r); window.scrollTo(0, y);
    });
  }

  // ---------- Boodschappen als notitie ----------
  const SOORTEN = ['groente & fruit', 'vlees, vis & vega', 'zuivel & eieren', 'brood & deeg', 'pasta, rijst & granen', 'conserven & potten', 'sauzen & olie', 'kruiden & specerijen', 'overig houdbaar'];
  const MEERVOUD = { teentje: 'teentjes', rol: 'rollen', zak: 'zakken', pakje: 'pakjes' };
  const productNaam = it => (it.p || it.n.replace(/\s*\(.*?\)/g, '').split(',')[0]).trim().toLowerCase();
  const eenheid = u => (u && u.startsWith('teentje') ? 'teentje' : (u || ''));
  const optioneel = (g, it) => /optioneel/i.test(g.groep || '') || /optioneel/i.test(it.n);

  // Telt dezelfde producten op en groepeert per soort (volgorde van de winkel)
  function groepeer(groepen, f) {
    const m = new Map();
    groepen.forEach(g => g.items.forEach(it => {
      if (it.s == null) return;
      const naam = productNaam(it), opt = optioneel(g, it), key = it.s + '|' + naam + '|' + opt;
      const e = m.get(key) || { naam, s: it.s, opt, delen: new Map() };
      const v = schaal(it.q, it.u, f);
      if (v != null) e.delen.set(eenheid(it.u), (e.delen.get(eenheid(it.u)) || 0) + v);
      m.set(key, e);
    }));
    return SOORTEN.map(s => ({ soort: s, regels: [...m.values()].filter(e => e.s === s).sort((a, b) => a.naam.localeCompare(b.naam, 'nl')) })).filter(g => g.regels.length);
  }
  function regelTekst(e) {
    const delen = [...e.delen].map(([u, v]) => fmtGetal(v) + (u ? ' ' + (v > 1 && MEERVOUD[u] ? MEERVOUD[u] : u) : ''));
    return [delen.join(' + '), e.naam].filter(Boolean).join(' ') + (e.opt ? ' (optioneel)' : '');
  }
  // Eén regel per item, zonder streepjes of lege regels: in Keep (+ > Checkboxes) of Notities (checklist)
  // wordt elke regel dan een afvinkbaar item. De kopjes per soort staan op eigen regels.
  function notitieTitel(r, personen) { return `Boodschappen ${r.titel} (${personen} pers.)`; }
  function notitieTekst(r, personen) {
    const f = personen / r.personen, uit = [];
    groepeer(r.ingredienten.filter(g => !g.keuze), f).forEach(g => uit.push(g.soort.toUpperCase(), ...g.regels.map(regelTekst)));
    // Alternatieven (bijv. saus A of B) staan los onderaan
    const keuzes = {};
    r.ingredienten.filter(g => g.keuze).forEach(g => (keuzes[g.keuze] = keuzes[g.keuze] || []).push(g));
    Object.entries(keuzes).forEach(([label, gs]) => {
      uit.push(`KIES ÉÉN: ${label.toUpperCase()}`);
      gs.forEach(g => uit.push(g.groep.toUpperCase(), ...groepeer([g], f).flatMap(x => x.regels.map(regelTekst))));
    });
    return uit.join('\n');
  }
  // Deelt de notitie via het deelmenu (Notities, Reminders, Keep, ...); anders downloaden als .txt
  async function deelNotitie(r, personen) {
    const tekst = notitieTekst(r, personen), titel = notitieTitel(r, personen);
    if (navigator.share) {
      try { await navigator.share({ title: titel, text: tekst }); return ''; }
      catch (e) { if (e && e.name === 'AbortError') return ''; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([tekst], { type: 'text/plain;charset=utf-8' }));
    a.download = titel + '.txt';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    return 'Notitie gedownload (.txt).';
  }

  async function toggleWake() {
    const btn = document.getElementById('wake'), msg = document.getElementById('msg');
    try {
      if (wilWake) { wilWake = false; if (wakeLock) await wakeLock.release(); wakeLock = null; btn.setAttribute('aria-pressed', 'false'); msg.textContent = ''; return; }
      if (!('wakeLock' in navigator)) throw new Error();
      wakeLock = await navigator.wakeLock.request('screen'); wilWake = true;
      wakeLock.addEventListener('release', () => { wakeLock = null; });
      btn.setAttribute('aria-pressed', 'true'); msg.textContent = 'Scherm blijft aan.';
    } catch {
      wakeLock = null; wilWake = false; btn.setAttribute('aria-pressed', 'false');
      msg.textContent = 'Scherm aan houden werkt niet in deze browser.';
    }
  }
  // Wake lock vervalt als de tab verborgen wordt; vraag hem opnieuw aan bij terugkeer.
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && wilWake && !wakeLock) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch {}
    }
  });

  function route() {
    const id = decodeURIComponent(location.hash.slice(1));
    const r = recepten.find(x => x.id === id);
    window.scrollTo(0, 0);
    document.title = r ? r.titel + ' · Kookboek' : 'Kookboek';
    r ? renderRecept(r) : renderOverzicht();
  }

  fetch('recepten.json', { cache: 'no-cache' })
    .then(res => { if (!res.ok) throw new Error(res.status); return res.json(); })
    .then(data => { recepten = data.recepten; route(); window.addEventListener('hashchange', route); })
    .catch(() => { app.innerHTML = '<main class="wrap"><p class="empty">De recepten konden niet geladen worden.</p></main>'; });
})();
</script>
</body>
</html>
